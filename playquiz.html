<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- Viewport meta tag to ensure proper scaling on different devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title of the web page -->
    <title> Quizzigo | Play Quiz game Learn & Gain Knowledge </title>
    <!-- Favicon Of Site -->
    <link rel="shortcut icon" href="/images/quiz_favicon.png" type="image/x-icon">
    <!-- Link to Tailwind CSS for styling -->
    <link href="/css/tailwind.min.css" rel="stylesheet">
    <!-- Link to Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Link to custom CSS for additional styles -->
    <link rel="stylesheet" href="/css/style.css">
    <!-- jQuery library -->
    <script src="/js/jquery-3.6.4.min.js"></script>
    <style>
        /* Reward button pulse animation */
        @keyframes pulse-coin {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.18);
            }

            100% {
                transform: scale(1);
            }
        }

        #lottie-container {
            animation: pulse-coin 2s ease-in-out infinite;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        #lottie-container:active {
            transform: scale(0.9);
        }

        /* Toast styles */
        #toast-container .toast-item {
            background: #1f1f1f;
            color: #fff;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(60px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1615420563101212"
        data-overlays="bottom" crossorigin="anonymous"></script>
    <script>
        window.adsbygoogle = window.adsbygoogle || [];

        // ✅ Proper global functions
        window.adBreak = function (o) {
            adsbygoogle.push(o);
        };

        window.adConfig = function (o) {
            adsbygoogle.push(o);
        };

        // ✅ Enable preload
        adConfig({
            preloadAdBreaks: 'on',
            sound: 'off'
        });

        // ✅ Trigger preload after load
        window.addEventListener('load', () => {
            setTimeout(() => {
                adBreak({
                    type: 'reward',
                    name: 'reward_coin'
                });
            }, 3000);
        });
    </script>
</head>

<body>
    <div>
        <div class="mobile">
            <div id="toast-container" class="fixed top-5 right-5 space-y-4" style="z-index: 99999;"></div>

            <div class="fist_layer text-center p-3 mt-3">
                <div style="width: 100%;">
                    <ins class="adsbygoogle my-5 ads-content" style="display:block; text-align:center;"
                        data-ad-layout="in-article" data-ad-format="fluid" data-ad-client="ca-pub-1615420563101212"
                        data-ad-slot="4306431074"></ins>
                    <script>
                        (adsbygoogle = window.adsbygoogle || []).push({});
                    </script>
                </div>
                <div class="row">
                    <div class="col mt-10">
                        <div class="ft_area p-3">
                            <h4 class="font-bold">Quiz Game</h4>
                            <div class="font-bold text mb-3">You have won <i class="fa-solid fa-coins"
                                    style="color: #FFD43B;"></i> 100 Coins
                            </div>

                            <button class="default_btn" onclick="goToNextPage('/home.html')">Play Quiz</button>

                            <div class="QA_rules">
                                <ul class="mt-1 p-3 text-gray-400 text-sm font-bold">
                                    <li>Play Quizzes in 25+ categories like GK, Sports, Bollywood, Business, Cricket &
                                        More!
                                    </li>
                                    <li>Compete with lakhs of other players!</li>
                                    <li>Win Coins for every game</li>
                                    <li>Trusted by millions of other quiz enthusiasts like you!</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>

        function showToast(e) {
            // Create the toast element
            const toast = document.createElement('div');
            toast.className = 'max-w-xs  border border-gray-200 p-4 rounded shadow-lg flex items-center space-x-4';
            toast.innerHTML = `
            <div class="flex-shrink-0">
              <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7 12l5 5L21 7" />
              </svg>
            </div>
            <div>
              <p class="text-sm font-semibold">${e.title}</p>
              <p class="text-sm">${e.msg}</p>
            </div>
          `;
            // Append the toast to the container
            document.getElementById('toast-container').appendChild(toast);
            // Automatically remove the toast after 3 seconds
            setTimeout(() => {
                toast.remove();
            }, 3000);

        }
        function RewardAd() {
            if (typeof adBreak !== 'function') {
                console.log('adBreak not ready');
                showToast({ title: 'No Ad', msg: 'Try later' });
                return;
            }

            adBreak({
                type: 'reward',
                name: 'reward_coin',

                beforeReward: function (showAdFn) {
                    showAdFn();
                },

                adDismissed: function () {
                    showToast({ title: 'Dismissed', msg: '🚫 No reward given' });
                    closereward();
                },

                adBreakDone: function (placementInfo) {
                    console.log('breakStatus:', placementInfo.breakStatus);

                    if (placementInfo.breakStatus === 'viewed') {
                        addCoins(100);
                        showToast({ title: 'Congratulations!', msg: '🥳 +100 coins added!' });
                        closereward();
                    } else {
                        showToast({ title: 'No Ad Available', msg: 'Try again later' });
                    }
                }
            });
        }

        function goToNextPage(url) {
            if (typeof adBreak !== 'function') {
                window.location.href = url;
                return;
            }

            adBreak({
                type: 'start',
                name: 'page_transition',

                beforeAd: () => {
                    console.log('Ad about to show');
                },

                adBreakDone: (placementInfo) => {
                    console.log('Status:', placementInfo.breakStatus);

                    // ALWAYS navigate after
                    window.location.href = url;
                }
            });
        }
    </script>
</body>

</html>
