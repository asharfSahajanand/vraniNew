    <script>
        // ─── Coin helpers ──────────────────────────────────────────────
        function getCoins() {
            return parseInt(localStorage.getItem('totalcoin') || '0', 10);
        }
        function addCoins(amount) {
            const newTotal = getCoins() + amount;
            localStorage.setItem('totalcoin', newTotal);
            document.getElementById('total_coins').innerText = newTotal;
            return newTotal;
        }

        // Initialise display
        document.getElementById('total_coins').innerText = getCoins();

        // ─── Toast ─────────────────────────────────────────────────────
        function showToast({ title, msg }) {
            const toast = document.createElement('div');
            toast.className = 'toast-item';
            toast.innerHTML = `
                <svg style="flex-shrink:0;width:20px;height:20px;color:#4ade80"
                    xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12l2 2 4-4M7 12l5 5L21 7"/>
                </svg>
                <div>
                    <p style="font-weight:600;margin:0">${title}</p>
                    <p style="margin:0;opacity:0.85">${msg}</p>
                </div>`;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ─── Reward Ad ─────────────────────────────────────────────────
        function RewardAd() {
            // Fallback: if adBreak not loaded, just give coins
            if (adBreak !== 'function') {
                console.log("ksdlfjsk");

                showToast({ title: 'Coins Not Added!', msg: 'Try Later (ad not available)' });
                return;
            }

            adBreak({
                type: 'reward',
                name: 'reward_coin',
                beforeReward: function (showAdFn) {
                    showAdFn();
                },
                adDismissed: function () {
                    showToast({ title: 'Dismissed', msg: '🚫 Ad was dismissed — no coins awarded' });
                },
                adViewed: function () {
                    // fires when ad fully watched — coins awarded in adBreakDone
                },
                adBreakDone: function (placementInfo) {
                    console.log('breakStatus:', placementInfo.breakStatus);
                    if (placementInfo.breakStatus === 'viewed') {
                        addCoins(100);
                        showToast({ title: 'Congratulations!', msg: '🥳 +100 coins added!' });
                    } else if (
                        placementInfo.breakStatus === 'noAdPreloaded' ||
                        placementInfo.breakStatus === 'noAdAvailable' ||
                        placementInfo.breakStatus === 'frequencyCapped' ||
                        placementInfo.breakStatus === 'other'
                    ) {
                        // Fallback — reward anyway so user isn't frustrated
                        addCoins(100);
                        showToast({ title: 'Coins Not Added!', msg: 'Try Later (ad not available)' });
                    }
                }
            });
        }

        let allcoins = localStorage.getItem('totalcoin');
        document.getElementById('total_coins').innerText = allcoins
        document.getElementById('profile_total_coins').innerText = allcoins
    </script>
